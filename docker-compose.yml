# Local development stack only. Do not expose this compose file as a production deployment.
# Put DB_PASSWORD and MYSQL_ROOT_PASSWORD in your untracked local .env file.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gsx_app
    working_dir: /var/www
    user: "www-data"
    volumes:
      - ./:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-gsx}
      DB_USERNAME: ${DB_USERNAME:-gsx}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  node:
    image: node:24
    container_name: gsx_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: tail -f /dev/null
    networks:
      - laravel

  db:
    image: mysql:8.4
    container_name: gsx_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gsx}
      MYSQL_USER: ${DB_USERNAME:-gsx}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: gsx_phpmyadmin
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8092:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel

  nginx:
    image: nginx:stable
    container_name: gsx_nginx
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

networks:
  laravel:

volumes:
  dbdata:
