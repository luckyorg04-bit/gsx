name: GSX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gsx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_DRIVER: sync
      MAIL_DRIVER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, tokenizer, xml, zip
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Lint application PHP files
        run: find app bootstrap config database routes tests public/installer -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run automated tests
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Build production frontend assets
        run: npm run production

      - name: Commit initial dependency lockfiles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add dependency lockfiles [skip ci]"
          git push
