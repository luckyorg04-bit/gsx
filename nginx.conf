server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 32m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Retire the entire legacy browser installer, including nested PHP helpers.
    location ^~ /installer/ {
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny hidden files, including .env, .git and editor metadata.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Never serve source, dependency manifests, dumps, backups or logs.
    location ~* \.(env|log|sql|sqlite|bak|backup|ini|lock|ya?ml|dist)$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
